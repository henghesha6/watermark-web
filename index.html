<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>手机端图片去水印工具</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 flex flex-col justify-between">
    <div class="max-w-4xl mx-auto px-4 py-8 w-full">
        <header class="text-center mb-8">
            <h1 class="text-2xl font-bold text-slate-900 mb-2">🛠️ 工业配件图片去水印</h1>
            <p class="text-sm text-slate-500">专为清除左上角“AI生成”与右下角“剪映AI”设计，纯前端处理安全快捷</p>
        </header>

        <!-- 上传区域 -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 mb-8 text-center">
            <label for="fileInput" class="cursor-pointer flex flex-col items-center justify-center border-2 border-dashed border-slate-300 rounded-xl p-8 hover:border-blue-500 transition-colors bg-slate-50">
                <svg class="w-12 h-12 text-slate-400 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                <span class="text-sm font-medium text-slate-700">点击选择图片或拍照上传</span>
                <span class="text-xs text-slate-400 mt-1">支持多选，手机与电脑均可使用</span>
            </label>
            <input type="file" id="fileInput" accept="image/*" multiple class="hidden">
        </div>

        <!-- 操作按钮与状态 -->
        <div id="actionPanel" class="hidden flex flex-col sm:flex-row items-center justify-between gap-4 mb-8 bg-white p-4 rounded-xl shadow-sm border border-slate-200">
            <span id="fileCount" class="text-sm font-medium text-slate-600">已选择 0 张图片</span>
            <div class="flex items-center gap-3 w-full sm:w-auto">
                <button id="processBtn" class="flex-1 sm:flex-none bg-blue-600 hover:bg-blue-700 text-white font-medium px-6 py-2.5 rounded-lg shadow-sm transition-all text-sm">开始去除水印</button>
                <button id="downloadAllBtn" class="hidden flex-1 sm:flex-none bg-emerald-600 hover:bg-emerald-700 text-white font-medium px-6 py-2.5 rounded-lg shadow-sm transition-all text-sm">打包下载全部</button>
            </div>
        </div>

        <!-- 预览网格 -->
        <div id="previewGrid" class="grid grid-cols-1 sm:grid-cols-2 gap-4"></div>
    </div>

    <footer class="text-center py-6 text-xs text-slate-400 border-t border-slate-200 bg-white mt-12">
        Powered by GitHub Pages & HTML5 Canvas
    </footer>

    <script>
        const fileInput = document.getElementById('fileInput');
        const actionPanel = document.getElementById('actionPanel');
        const fileCount = document.getElementById('fileCount');
        const processBtn = document.getElementById('processBtn');
        const downloadAllBtn = document.getElementById('downloadAllBtn');
        const previewGrid = document.getElementById('previewGrid');

        let selectedFiles = [];
        let processedResults = [];

        fileInput.addEventListener('change', (e) => {
            selectedFiles = Array.from(e.target.files);
            if (selectedFiles.length > 0) {
                actionPanel.classList.remove('hidden');
                fileCount.textContent = `已选择 ${selectedFiles.length} 张图片`;
                renderPreviews();
            }
        });

        function renderPreviews() {
            previewGrid.innerHTML = '';
            selectedFiles.forEach((file, index) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const card = document.createElement('div');
                    card.className = 'bg-white rounded-xl border border-slate-200 p-4 shadow-sm flex flex-col gap-3';
                    card.innerHTML = `
                        <div class="relative aspect-square bg-slate-100 rounded-lg overflow-hidden flex items-center justify-center">
                            <img src="${e.target.result}" class="object-contain w-full h-full" id="img-${index}">
                        </div>
                        <div class="flex items-center justify-between text-xs text-slate-500">
                            <span class="truncate max-w-[180px]">${file.name}</span>
                            <span id="status-${index}" class="text-amber-600 font-medium">等待处理</span>
                        </div>
                    `;
                    previewGrid.appendChild(card);
                };
                reader.readAsDataURL(file);
            });
        }

        processBtn.addEventListener('click', async () => {
            processedResults = [];
            downloadAllBtn.classList.add('hidden');
            processBtn.disabled = true;
            processBtn.textContent = '处理中...';

            for (let i = 0; i < selectedFiles.length; i++) {
                const file = selectedFiles[i];
                const statusSpan = document.getElementById(`status-${i}`);
                statusSpan.textContent = '处理中...';
                statusSpan.className = 'text-blue-600 font-medium';

                try {
                    const processedDataUrl = await removeWatermark(file);
                    processedResults.push({ name: file.name, dataUrl: processedDataUrl });

                    // 更新预览图为去水印后的效果
                    const imgEl = document.getElementById(`img-${i}`);
                    imgEl.src = processedDataUrl;

                    statusSpan.textContent = '处理完成';
                    statusSpan.className = 'text-emerald-600 font-medium';
                } catch (err) {
                    statusSpan.textContent = '处理失败';
                    statusSpan.className = 'text-rose-600 font-medium';
                }
            }

            processBtn.disabled = false;
            processBtn.textContent = '重新处理';
            if (processedResults.length > 0) {
                downloadAllBtn.classList.remove('hidden');
            }
        });

        function removeWatermark(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        canvas.width = img.width;
                        canvas.height = img.height;
                        ctx.drawImage(img, 0, 0);

                        const w = canvas.width;
                        const h = canvas.height;

                        // 动态计算水印区域比例并进行边缘像素复制修复（覆盖左上角与右下角）
                        const tlWidth = Math.floor(w * 0.18);
                        const tlHeight = Math.floor(h * 0.10);
                        if (tlWidth > 0 && tlHeight > 0) {
                            // 用上方干净背景向下覆盖左上角
                            ctx.drawImage(canvas, 10, tlHeight + 5, tlWidth, 10, 10, 10, tlWidth, tlHeight);
                        }

                        const brWidth = Math.floor(w * 0.18);
                        const brHeight = Math.floor(h * 0.10);
                        if (brWidth > 0 && brHeight > 0) {
                            // 用上方干净背景向上覆盖右下角
                            ctx.drawImage(canvas, w - brWidth - 10, h - brHeight - 25, brWidth, 10, w - brWidth - 10, h - brHeight - 10, brWidth, brHeight);
                        }

                        resolve(canvas.toDataURL('image/jpeg', 0.95));
                    };
                    img.onerror = reject;
                    img.src = e.target.result;
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        downloadAllBtn.addEventListener('click', () => {
            const zip = new JSZip();
            processedResults.forEach((item, index) => {
                const base64Data = item.dataUrl.replace(/^data:image\/jpeg;base64,/, "");
                zip.file(`clean_${index + 1}_${item.name}`, base64Data, { base64: true });
            });

            zip.generateAsync({ type: "blob" }).then((content) => {
                saveAs(content, "watermark_removed_images.zip");
            });
        });
    </script>
</body>
</html>
