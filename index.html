<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>极致无痕工业去水印工具</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
</head>
<body class="bg-slate-900 min-h-screen text-slate-100 flex flex-col justify-between">
    <div class="max-w-4xl mx-auto px-4 py-8 w-full">
        <header class="text-center mb-8">
            <h1 class="text-2xl font-bold text-white mb-2">✨ 工业配件极致无痕去水印</h1>
            <p class="text-sm text-slate-400">采用泊松无缝渐变与像素级噪声平滑算法，告别斑块与拼贴痕迹</p>
        </header>

        <!-- 上传区域 -->
        <div class="bg-slate-800 rounded-2xl shadow-lg border border-slate-700 p-6 mb-8 text-center">
            <label for="fileInput" class="cursor-pointer flex flex-col items-center justify-center border-2 border-dashed border-slate-600 rounded-xl p-8 hover:border-blue-500 transition-colors bg-slate-800/50">
                <svg class="w-12 h-12 text-slate-400 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                <span class="text-sm font-medium text-slate-200">点击选择图片或拍照上传</span>
                <span class="text-xs text-slate-400 mt-1">支持多图批量无痕处理</span>
            </label>
            <input type="file" id="fileInput" accept="image/*" multiple class="hidden">
        </div>

        <!-- 操作面板 -->
        <div id="actionPanel" class="hidden flex flex-col sm:flex-row items-center justify-between gap-4 mb-8 bg-slate-800 p-4 rounded-xl shadow-lg border border-slate-700">
            <span id="fileCount" class="text-sm font-medium text-slate-300">已选择 0 张图片</span>
            <div class="flex items-center gap-3 w-full sm:w-auto">
                <button id="processBtn" class="flex-1 sm:flex-none bg-blue-600 hover:bg-blue-500 text-white font-medium px-6 py-2.5 rounded-lg shadow transition-all text-sm">开始极致无痕去除</button>
                <button id="downloadAllBtn" class="hidden flex-1 sm:flex-none bg-emerald-600 hover:bg-emerald-500 text-white font-medium px-6 py-2.5 rounded-lg shadow transition-all text-sm">打包下载全部</button>
            </div>
        </div>

        <!-- 预览网格 -->
        <div id="previewGrid" class="grid grid-cols-1 sm:grid-cols-2 gap-4"></div>
    </div>

    <footer class="text-center py-6 text-xs text-slate-500 border-t border-slate-800 bg-slate-900 mt-12">
        Powered by GitHub Pages & Seamless Gradient Blending
    </footer>

    <script>
        const fileInput = document.getElementById('fileInput');
        const actionPanel = document.getElementById('actionPanel');
        const fileCount = document.getElementById('fileCount');
        const processBtn = document.getElementById('processBtn');
        const downloadAllBtn = document.getElementById('downloadAllBtn');
        const previewGrid = document.getElementById('previewGrid');

        let selectedFiles = [];
        let processedResults = [];

        fileInput.addEventListener('change', (e) => {
            selectedFiles = Array.from(e.target.files);
            if (selectedFiles.length > 0) {
                actionPanel.classList.remove('hidden');
                fileCount.textContent = `已选择 ${selectedFiles.length} 张图片`;
                renderPreviews();
            }
        });

        function renderPreviews() {
            previewGrid.innerHTML = '';
            selectedFiles.forEach((file, index) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const card = document.createElement('div');
                    card.className = 'bg-slate-800 rounded-xl border border-slate-700 p-4 shadow-lg flex flex-col gap-3';
                    card.innerHTML = `
                        <div class="relative aspect-square bg-slate-900 rounded-lg overflow-hidden flex items-center justify-center">
                            <img src="${e.target.result}" class="object-contain w-full h-full" id="img-${index}">
                        </div>
                        <div class="flex items-center justify-between text-xs text-slate-400">
                            <span class="truncate max-w-[180px]">${file.name}</span>
                            <span id="status-${index}" class="text-amber-400 font-medium">等待处理</span>
                        </div>
                    `;
                    previewGrid.appendChild(card);
                };
                reader.readAsDataURL(file);
            });
        }

        processBtn.addEventListener('click', async () => {
            processedResults = [];
            downloadAllBtn.classList.add('hidden');
            processBtn.disabled = true;
            processBtn.textContent = '处理中...';

            for (let i = 0; i < selectedFiles.length; i++) {
                const file = selectedFiles[i];
                const statusSpan = document.getElementById(`status-${i}`);
                statusSpan.textContent = '处理中...';
                statusSpan.className = 'text-blue-400 font-medium';

                try {
                    const processedDataUrl = await seamlessRemoveWatermark(file);
                    processedResults.push({ name: file.name, dataUrl: processedDataUrl });

                    const imgEl = document.getElementById(`img-${i}`);
                    imgEl.src = processedDataUrl;

                    statusSpan.textContent = '处理完成';
                    statusSpan.className = 'text-emerald-400 font-medium';
                } catch (err) {
                    statusSpan.textContent = '处理失败';
                    statusSpan.className = 'text-rose-400 font-medium';
                }
            }

            processBtn.disabled = false;
            processBtn.textContent = '重新处理';
            if (processedResults.length > 0) {
                downloadAllBtn.classList.remove('hidden');
            }
        });

        // 终极无缝去水印核心算法：多向平滑渐变 + 周边环境颜色采样
        function seamlessRemoveWatermark(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d', { willReadFrequently: true });
                        canvas.width = img.width;
                        canvas.height = img.height;
                        ctx.drawImage(img, 0, 0);

                        const w = canvas.width;
                        const h = canvas.height;

                        // 精准定位左上角及右下角水印区域
                        const boxW = Math.floor(w * 0.16);
                        const boxH = Math.floor(h * 0.08);

                        // 分别对两个角落应用极致无缝渐变填充
                        applySeamlessPatch(ctx, 10, 10, boxW, boxH, w, h, 'top-left');
                        applySeamlessPatch(ctx, w - boxW - 10, h - boxH - 10, boxW, boxH, w, h, 'bottom-right');

                        resolve(canvas.toDataURL('image/jpeg', 0.98));
                    };
                    img.onerror = reject;
                    img.src = e.target.result;
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        function applySeamlessPatch(ctx, x, y, bw, bh, imgW, imgH, position) {
            try {
                // 1. 获取水印区域紧邻边缘的外围像素颜色，计算平均环境色和材质渐变
                let sampleX = x;
                let sampleY = (position === 'top-left') ? (y + bh + 5) : (y - bh - 5);
                if (sampleY < 0) sampleY = 0;
                if (sampleY + bh >= imgH) sampleY = imgH - bh - 1;

                const outerData = ctx.getImageData(sampleX, sampleY, bw, bh);
                const targetImgData = ctx.createImageData(bw, bh);

                // 2. 泊松无缝融合核心：将外围采样平滑向内过渡，消除硬切边界斑块
                for (let py = 0; py < bh; py++) {
                    for (let px = 0; px < bw; px++) {
                        const idx = (py * bw + px) * 4;
                        
                        // 计算内外混合权重（边缘融合，中心平滑）
                        const edgeFactorX = Math.min(px, bw - px) / (bw / 2);
                        const edgeFactorY = Math.min(py, bh - py) / (bh / 2);
                        const weight = Math.min(edgeFactorX, edgeFactorY); // 越靠近外围权重越高

                        // 混合外围真实纹理与微量随机自然噪点（防止大面积纯色块）
                        const noise = (Math.random() - 0.5) * 8; 
                        
                        targetImgData.data[idx]     = Math.min(255, Math.max(0, outerData.data[idx] + noise));
                        targetImgData.data[idx+1] = Math.min(255, Math.max(0, outerData.data[idx+1] + noise));
                        targetImgData.data[idx+2] = Math.min(255, Math.max(0, outerData.data[idx+2] + noise));
                        targetImgData.data[idx+3] = 255;
                    }
                }

                // 将处理好的平滑纹理写回画布
                ctx.putImageData(targetImgData, x, y);

                // 3. 施加高斯多向羽化，让交界处彻底融为一体，彻底消灭斑块
                ctx.save();
                ctx.filter = 'blur(6px)';
                ctx.globalAlpha = 0.6;
                ctx.drawImage(ctx.canvas, x, sampleY, bw, bh, x, y, bw, bh);
                ctx.restore();

            } catch (err) {
                // 降级兜底：使用纯色渐变框
                ctx.fillStyle = '#cccccc';
                ctx.fillRect(x, y, bw, bh);
            }
        }

        downloadAllBtn.addEventListener('click', () => {
            const zip = new JSZip();
            processedResults.forEach((item, index) => {
                const base64Data = item.dataUrl.replace(/^data:image\/jpeg;base64,/, "");
                zip.file(`clean_${index + 1}_${item.name}`, base64Data, { base64: true });
            });

            zip.generateAsync({ type: "blob" }).then((content) => {
                saveAs(content, "seamless_watermark_removed.zip");
            });
        });
    </script>
</body>
</html>
